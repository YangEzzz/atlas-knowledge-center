<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas · 三个设计方向</title>
<style>
:root{--paper:#eeefef;--ink:#242830;--line:#d5d8dc;--blue:#3358df;--white:#fff;--font:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;--serif:"Noto Serif SC","Songti SC",SimSun,serif;--mono:Consolas,"SFMono-Regular",monospace;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--r1:4px;--r2:8px;--r3:16px;--r4:24px}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.7}button,input{font:inherit}button{cursor:default}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:4px}body>input{position:absolute;opacity:0;pointer-events:none}.review{padding:20px 32px;background:var(--white);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:24px}.review strong{font-size:16px}.review small{display:block;color:#606771;font-size:12px}.switcher{display:flex;gap:8px}.switcher label{padding:8px 16px;border:1px solid var(--line);border-radius:8px;cursor:pointer;white-space:nowrap}#a:checked~.review label[for=a],#b:checked~.review label[for=b],#c:checked~.review label[for=c]{background:var(--ink);color:var(--white);border-color:var(--ink)}body>input:focus-visible~.review .switcher{outline:3px solid var(--blue);outline-offset:4px}.direction{display:none;min-height:calc(100vh - 88px)}#a:checked~.a,#b:checked~.b,#c:checked~.c{display:block}.shell{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:780px}.sidebar{padding:32px 20px;display:flex;flex-direction:column;gap:32px}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:750;letter-spacing:1px}.brand-mark{width:32px;height:32px;display:grid;place-items:center;font-size:20px;letter-spacing:0}.brand span{font-size:11px;display:block;font-weight:400;letter-spacing:0}.nav{display:grid;gap:8px}.nav div{padding:8px 12px;display:flex;align-items:center;gap:12px;border-radius:var(--r1)}.nav em{font-family:var(--mono);font-style:normal;font-size:11px;opacity:.6}.nav small{margin-left:auto}.nav-title{font-size:10px;text-transform:uppercase;letter-spacing:2px;margin:16px 12px 4px}.sidebar-foot{margin-top:auto;font-size:12px}.avatar{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;margin-right:8px;font-size:11px;font-family:var(--mono)}.workspace{min-width:0}.topbar{height:64px;padding:0 40px;display:flex;justify-content:space-between;align-items:center;font-size:12px}.topbar .right{display:flex;gap:24px;align-items:center}.body{padding:32px 40px 40px;max-width:1500px;margin:auto}.eyebrow{font-size:11px;letter-spacing:2px;font-family:var(--mono);margin-bottom:12px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}h1,h2,h3,p{margin:0}h1{font-size:36px;font-weight:650;line-height:1.3}h2{font-size:16px;font-weight:650}h3{font-size:16px}p{line-height:1.8}.subtitle{margin-top:12px}.action{display:inline-block;padding:8px 16px;border:0;border-radius:var(--r1);font-weight:550}.search{display:flex;align-items:center;gap:16px;padding:16px 20px;margin-top:32px;min-height:64px}.search svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5}.search span{flex:1}.key{font-family:var(--mono);font-size:11px;padding:0 6px;opacity:.7}.topics{display:flex;gap:16px;font-size:12px;margin-top:12px;flex-wrap:wrap}.columns{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:32px;margin-top:32px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.section-head small{font-size:11px;font-weight:400}.section-head>a{font-size:12px}.entry{display:flex;align-items:center;gap:16px;padding:16px 0}.entry-main{flex:1;min-width:0}.entry-title{font-weight:550}.meta{font-size:12px}.tag{display:inline-block;font-size:10px;padding:0 6px;border-radius:var(--r1);white-space:nowrap}.arrow{font-size:18px}.block{margin-top:32px}.fineprint{font-size:11px;margin-top:32px}.logo-tile{width:40px;height:40px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;flex:none}.project-name{display:flex;gap:12px;align-items:center}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;font-weight:400;font-size:10px;letter-spacing:1px}td,th{padding:16px 8px}td:first-child,th:first-child{padding-left:0}.small-link{white-space:nowrap}.update{padding:16px 0}.update .meta{margin-top:4px}.update strong{font-size:13px;font-weight:500}.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:8px}.count{font-family:var(--mono);font-size:11px}.statusbar{display:flex;gap:24px;font-size:11px;align-items:center}.rail-note{padding:16px;margin-top:24px;font-size:12px}.caption{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;font-size:12px;gap:24px}.caption b{font-size:14px}.preview-badge{font-family:var(--mono);font-size:10px;white-space:nowrap}
/* A: outlined surfaces, carbon background, mint focus. */
.a{--color-bg:#101419;--color-panel:#151b21;--color-text:#e5eaf0;--color-muted:#929eab;--color-border:#2a333d;--color-accent:#98efc6;background:var(--color-bg);color:var(--color-text)}.a .caption{background:#0c1014;border-bottom:1px solid var(--color-border);color:var(--color-muted)}.a .caption b{color:var(--color-accent)}.a .sidebar{border-right:1px solid var(--color-border);background:#0d1116}.a .brand-mark{border:1px solid var(--color-accent);color:var(--color-accent);border-radius:var(--r1)}.a .brand span,.a .nav-title,.a .sidebar-foot,.a .meta,.a .subtitle,.a .topics,.a .topbar,.a th,.a .fineprint{color:var(--color-muted)}.a .nav .active{background:#202d2b;color:var(--color-accent)}.a .avatar{background:#293c35;color:var(--color-accent)}.a .topbar{border-bottom:1px solid var(--color-border)}.a .action{background:var(--color-accent);color:#10231a}.a .eyebrow,.a .count,.a .small-link{color:var(--color-accent)}.a .search{background:var(--color-panel);border:1px solid #52685e;border-radius:var(--r1);color:var(--color-muted)}.a .search svg{color:var(--color-accent)}.a .entry,.a td,.a th,.a .update{border-bottom:1px solid var(--color-border)}.a .tag{background:#20332c;color:var(--color-accent)}.a .logo-tile{background:#202830;color:#b5c1cf;border:1px solid var(--color-border);border-radius:var(--r1)}.a .rail-note{border:1px solid var(--color-border);color:var(--color-muted)}.a .dot{background:var(--color-accent)}.a .entry-title{font-size:14px}.a .statusbar{border-top:1px solid var(--color-border);padding-top:16px;color:var(--color-muted)}
/* B: warm paper, editorial typography, rules instead of card enclosures. */
.b{--color-bg:#f5f2eb;--color-text:#302e29;--color-muted:#7b766c;--color-border:#d9d2c4;--color-accent:#8d462f;background:var(--color-bg);color:var(--color-text)}.b .caption{background:#eae5d9;color:#746b5c;border-bottom:1px solid var(--color-border)}.b .caption b{color:var(--color-accent)}.b .sidebar{background:#eee9df;border-right:1px solid var(--color-border)}.b .brand{font-family:Georgia,var(--serif);letter-spacing:0;font-size:25px}.b .brand-mark{color:var(--color-accent);font-family:Georgia,serif;font-size:36px}.b .nav .active{color:var(--color-accent);background:#e5ddcf}.b .nav em{font-family:Georgia,serif}.b .nav-title,.b .sidebar-foot,.b .meta,.b .subtitle,.b .topics,.b .topbar,.b th,.b .fineprint{color:var(--color-muted)}.b .avatar{background:#ded6c7;color:#66563e}.b .topbar{border-bottom:1px solid var(--color-border)}.b .eyebrow{color:var(--color-accent)}.b h1{font-family:var(--serif);font-weight:500;font-size:40px}.b .action{color:var(--color-accent);background:transparent;border-bottom:1px solid var(--color-accent);border-radius:0;padding:4px 0}.b .search{border-bottom:2px solid var(--color-text);padding-left:0;padding-right:0;color:var(--color-muted);font-family:var(--serif);font-size:18px}.b .search .key{font-family:var(--mono);font-size:11px}.b .columns{grid-template-columns:minmax(0,1fr) 256px;gap:48px}.b .section-head{border-top:1px solid var(--color-text);padding-top:12px}.b .section-head h2{font-family:var(--serif);font-size:19px;font-weight:500}.b .entry{border-bottom:1px solid var(--color-border)}.b .entry-title{font-family:var(--serif);font-size:18px}.b .entry-number{font-family:Georgia,serif;color:var(--color-accent);font-size:22px;width:32px}.b .tag{color:var(--color-accent);border:1px solid var(--color-border);background:transparent}.b .update{border-bottom:1px solid var(--color-border)}.b .project-catalog{margin-top:8px}.b .catalog-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--color-border);font-size:12px}.b .catalog-row strong{font-weight:500;font-size:14px}.b .catalog-row span{color:var(--color-muted)}.b .rail-note{border-left:2px solid var(--color-accent);padding:8px 0 8px 16px;color:var(--color-muted)}.b .statusbar{border-top:1px solid var(--color-border);padding-top:16px;color:var(--color-muted)}
/* C: tinted surfaces, indigo identifiers, project-first cards. */
.c{--color-bg:#f5f6fa;--color-panel:#fff;--color-text:#1e2440;--color-muted:#737b91;--color-accent:#4d48c7;--color-border:#e4e6ee;background:var(--color-bg);color:var(--color-text)}.c .caption{background:#eaeafb;color:#737397}.c .caption b{color:var(--color-accent)}.c .sidebar{background:var(--color-panel)}.c .brand-mark{background:var(--color-accent);color:var(--white);border-radius:var(--r2)}.c .brand span,.c .nav-title,.c .sidebar-foot,.c .meta,.c .subtitle,.c .topics,.c .topbar,.c .fineprint{color:var(--color-muted)}.c .nav .active{background:#eeedfc;color:var(--color-accent);font-weight:600}.c .avatar{background:#e5e3fa;color:var(--color-accent)}.c .topbar{background:var(--color-panel)}.c .eyebrow{color:var(--color-accent)}.c h1{font-size:36px;font-weight:700}.c .action{background:var(--color-accent);color:var(--white);border-radius:var(--r2)}.c .search{background:var(--color-panel);border-radius:var(--r3);min-height:72px;color:var(--color-muted)}.c .search svg{color:var(--color-accent)}.c .topics span{background:#eaeaf5;padding:0 8px;border-radius:var(--r1);color:#676585}.c .columns{grid-template-columns:minmax(0,1fr) 264px;gap:24px}.c .project-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.c .project-card{padding:24px;background:var(--color-panel);border-radius:var(--r3);min-width:0}.c .project-card h3{margin-top:16px;font-size:16px}.c .project-card p{font-size:12px;color:var(--color-muted);margin-top:4px;min-height:44px}.c .logo-tile{border-radius:var(--r2);width:44px;height:44px;background:#e9e7ff;color:#5c4ac4}.c .project-card:nth-child(2) .logo-tile{background:#deeee8;color:#347565}.c .project-card:nth-child(3) .logo-tile{background:#f5e7df;color:#a26542}.c .project-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;font-size:11px}.c .project-links span{background:#f1f2f7;padding:4px 8px;border-radius:var(--r1)}.c .project-owner{margin-top:20px;font-size:11px;color:var(--color-muted)}.c .entry{padding:16px;background:var(--color-panel);border-radius:var(--r2);margin-bottom:8px}.c .entry-title{font-size:13px}.c .tag{color:var(--color-accent);background:#edecfb}.c .updates-panel{padding:0 20px;background:var(--color-panel);border-radius:var(--r3)}.c .update+.update{border-top:1px solid var(--color-border)}.c .rail-note{background:#eaeaf7;border-radius:var(--r2);color:#6d6b93}.c .statusbar{padding-top:8px;color:var(--color-muted)}.c .dot{background:#478f75}.c .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.c .tool{background:var(--color-panel);padding:16px;border-radius:var(--r2);font-size:13px}.c .tool .meta{margin-top:4px}
@media(min-width:1600px){.shell{grid-template-columns:240px 1fr}.body{padding-top:48px}.columns{margin-top:48px}}@media(max-width:1050px){.columns,.b .columns,.c .columns{grid-template-columns:1fr}.rail{display:none}.body{padding:24px}.topbar{padding:0 24px}.shell{grid-template-columns:176px 1fr}.c .project-grid{grid-template-columns:repeat(2,1fr)}.c .project-card:last-child{display:none}}@media(max-width:650px){.review{align-items:flex-start;flex-direction:column;padding:16px;gap:12px}.switcher{width:100%;gap:4px}.switcher label{padding:8px;font-size:12px;flex:1;text-align:center}.shell{grid-template-columns:1fr}.sidebar{display:none}.caption{padding:12px 16px}.caption span{display:none}.body{padding:24px 16px}.topbar{padding:0 16px}.heading{align-items:flex-start}h1,.b h1,.c h1{font-size:28px}.heading .action{font-size:12px;white-space:nowrap}.c .project-grid{grid-template-columns:1fr}.c .project-card:last-child{display:block}td:nth-child(3),th:nth-child(3){display:none}.c .tools{grid-template-columns:1fr}.preview-badge{display:none}}
</style>
</head>
<body>
<input type="radio" name="direction" id="a" checked aria-label="A 工程控制台"><input type="radio" name="direction" id="b" aria-label="B 数字档案馆"><input type="radio" name="direction" id="c" aria-label="C 项目导航站">
<header class="review"><div><strong>Atlas 设计方向对比</strong><small>同一首页 · 相同业务内容 · 示例数据</small></div><nav class="switcher" aria-label="切换设计方向"><label for="a">A · 工程控制台</label><label for="b">B · 数字档案馆</label><label for="c">C · 项目导航站</label></nav></header>
<main id="previews"></main>
<script>
/* Preview-only view assembly. All application actions remain static. */
const searchIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>';
const nav=(letter)=>`<aside class="sidebar"><div class="brand"><div class="brand-mark">A</div><div>Atlas<span>研发知识中心</span></div></div><div><div class="nav-title">工作空间</div><div class="nav"><div class="active"><em>01</em>首页<small>⌂</small></div><div><em>02</em>项目库<small>24</small></div><div><em>03</em>文档库<small>128</small></div><div><em>04</em>工具导航</div></div><div class="nav-title">我的空间</div><div class="nav"><div><em>05</em>我的收藏</div><div><em>06</em>最近访问</div></div></div><div class="sidebar-foot"><div style="margin-bottom:16px">管理中心 ↗</div><span class="avatar">YL</span>杨林<span style="float:right">研发</span></div></aside>`;
const updates=`<div class="update"><span class="tag">部署说明</span><p><strong>Nexus 生产环境部署指南</strong></p><div class="meta">杨林 · 20 分钟前更新</div></div><div class="update"><span class="tag">开发规范</span><p><strong>Helios 单点登录接入规范</strong></p><div class="meta">陈晨 · 1 小时前更新</div></div><div class="update"><span class="tag">环境说明</span><p><strong>云手机测试环境与账号申请</strong></p><div class="meta">李明 · 今天 09:20 更新</div></div>`;
const entries=(editorial=false)=>[['Nexus 多语言平台','测试环境 · nexus-test.example.com','测试环境'],['Helios 认证中心','接口文档 · 登录、授权与项目成员','API 文档'],['云手机用户端','线上环境 · cloud.example.com','线上环境']].map((x,i)=>`<div class="entry">${editorial?`<div class="entry-number">0${i+1}</div>`:''}<div class="entry-main"><div class="entry-title">${x[0]}</div><div class="meta">${x[1]}</div></div><span class="tag">${x[2]}</span><span class="arrow">↗</span></div>`).join('');
const projects=[['NX','Nexus 多语言平台','多语言词条、翻译与发布管理','杨林 · 陈晨','8 篇文档'],['HE','Helios 认证中心','统一账号、项目授权与单点登录','陈晨 · 李明','12 篇文档'],['CP','云手机用户端','云端设备与用户服务入口','李明 · 王璐','6 篇文档']];
const table=`<table><thead><tr><th>项目 / 名称</th><th>负责人</th><th>文档</th><th>资源入口</th></tr></thead><tbody>${projects.map(x=>`<tr><td><div class="project-name"><div class="logo-tile">${x[0]}</div><div><strong>${x[1]}</strong><div class="meta">${x[2]}</div></div></div></td><td>${x[3]}</td><td>${x[4]}</td><td class="small-link">线上 ↗ &nbsp; GitLab ↗</td></tr>`).join('')}</tbody></table>`;
const copy={a:['A · 工程控制台','深色基底 / 薄边框 / 薄荷绿定位','WORKSPACE / OVERVIEW','所有项目，一处直达。','从环境地址到部署说明，找到下一步需要的资料。'],b:['B · 数字档案馆','暖纸色 / 目录编排 / 衬线标题','ATLAS / KNOWLEDGE INDEX','让知识，有迹可循。','项目、环境与经验，归档在触手可及的地方。'],c:['C · 项目导航站','浅色分区 / 项目标识 / 靛蓝导航','YOUR ENGINEERING ATLAS','今天，从这里出发。','找到常用项目，直达环境、仓库和团队知识。']};
document.getElementById('previews').outerHTML=Object.entries(copy).map(([key,x])=>{
const main=key==='c'?`<div class="section-head"><h2>我的常用项目</h2><a>查看项目库 ↗</a></div><div class="project-grid">${projects.map(p=>`<article class="project-card"><div class="logo-tile">${p[0]}</div><h3>${p[1]}</h3><p>${p[2]}</p><div class="project-links"><span>线上 ↗</span><span>测试 ↗</span><span>GitLab ↗</span></div><div class="project-owner">${p[3]} · ${p[4]}</div></article>`).join('')}</div><div class="block"><div class="section-head"><h2>公司工具</h2><a>全部工具 ↗</a></div><div class="tools"><div class="tool">GitLab ↗<div class="meta">代码仓库</div></div><div class="tool">发布平台 ↗<div class="meta">应用部署与发布</div></div><div class="tool">监控平台 ↗<div class="meta">服务与日志查询</div></div></div></div>`:`<div class="section-head"><h2>${key==='b'?'常用索引':'常用入口'} <small> / 03</small></h2><a>我的收藏 ↗</a></div>${entries(key==='b')}<div class="block"><div class="section-head"><h2>${key==='b'?'项目目录':'项目库'} <small> / 24</small></h2><a>查看全部 ↗</a></div>${key==='b'?`<div class="project-catalog">${projects.map(p=>`<div class="catalog-row"><strong>${p[1]}</strong><span>${p[3]}</span><span>${p[4]} ↗</span></div>`).join('')}</div>`:table}</div>`;
return `<section class="direction ${key}"><div class="caption"><b>${x[0]}</b><span>${x[1]}</span><div class="preview-badge">方向探索 · 尚未定稿</div></div><div class="shell">${nav(key)}<div class="workspace"><header class="topbar"><span>工作空间 &nbsp; / &nbsp; 首页</span><div class="right"><span>2026 年 10 月 15 日 · 星期四</span><span>帮助 ↗</span></div></header><div class="body"><div class="eyebrow">${x[2]}</div><div class="heading"><div><h1>${x[3]}</h1><p class="subtitle">${x[4]}</p></div><span class="action">＋ 新建项目</span></div><div class="search">${searchIcon}<span>搜索项目、环境地址、仓库或文档</span><kbd class="key">Ctrl K</kbd></div><div class="topics"><span>最近搜索</span><span>Nexus</span><span>测试环境</span><span>Helios 登录</span><span>部署说明</span></div><div class="columns"><div>${main}</div><aside class="rail"><div class="section-head"><h2>${key==='b'?'最近编修':'最近更新'}</h2><a>全部 ↗</a></div><div class="${key==='c'?'updates-panel':''}">${updates}</div><div class="rail-note">3 篇文档超过 90 天未更新。<br>查看可能过期的资料 ↗</div></aside></div><footer class="block statusbar"><span><i class="dot"></i>24 个项目</span><span>86 个资源入口</span><span>128 篇文档</span></footer></div></div></div></section>`;
}).join('');
</script>
</body></html>
